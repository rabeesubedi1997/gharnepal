org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# The project lives on D: while Gradle/pub caches live on C: (see the build
# plan's confirmed decision to keep the SDK/caches off the project's drive).
# Kotlin's incremental compiler cache tries to compute a relative path
# between the two and throws ("this and base files have different roots")
# because Windows has no relative path across drive letters. Disabling
# incremental Kotlin compilation avoids it; full per-module recompiles are a
# fine trade-off for a mobile app this size.
kotlin.incremental=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
