name: Deploy to production

# Ships the Laravel backend + built React frontend to the live cPanel host
# (gharnepal.kitetool.com) on every push to main. Deliberately non-destructive:
# the deploy package never includes .env, storage/, or public/storage/ (real
# uploaded media lives there — see backend/config/filesystems.php's public
# disk root), and it's shipped as a plain tar extraction rather than an
# rsync --delete, so nothing on the server is ever deleted — only the files
# actually shipped in this run's tarball get overwritten. This matches the
# same "build locally, ship the artifact, never touch .env/storage" approach
# used for the original manual deploy.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  DEPLOY_PATH: /home/vertexen/gharnepal.kitetool.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Install backend dependencies (production, no dev)
        working-directory: backend
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Assemble deploy package
        run: |
          rm -rf deploy_package deploy.tar.gz
          mkdir -p deploy_package
          # Local-only rsync (this runner always has it) to copy the backend
          # tree minus anything that must never touch the live server:
          # .env* (real production config, never generated here), storage/
          # (runtime cache/logs/sessions — already correctly set up on the
          # server), and the test suite (not needed in production).
          rsync -a \
            --exclude='.env' \
            --exclude='.env.example' \
            --exclude='.env.production' \
            --exclude='storage/' \
            --exclude='tests/' \
            --exclude='phpunit.xml' \
            --exclude='.git/' \
            --exclude='node_modules/' \
            backend/ deploy_package/
          # Merge the built SPA on top of Laravel's own public/ (index.php,
          # .htaccess, etc. from backend/ stay; index.html + assets/ come
          # from the frontend build) — same merge the manual deploy zip did.
          rm -rf deploy_package/public/storage
          cp -r frontend/dist/. deploy_package/public/
          tar czf deploy.tar.gz -C deploy_package .

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload deploy package
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          scp -P "$SSH_PORT" -i ~/.ssh/deploy_key deploy.tar.gz "$SSH_USER@$SSH_HOST:~/deploy_incoming.tar.gz"

      - name: Extract on server and finish deploy
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          ssh -p "$SSH_PORT" -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" '
            set -e
            tar xzf ~/deploy_incoming.tar.gz -C "'"$DEPLOY_PATH"'"
            rm -f ~/deploy_incoming.tar.gz
            cd "'"$DEPLOY_PATH"'"
            php artisan migrate --force
            php artisan optimize:clear
          '

      - name: Clean up local key
        if: always()
        run: rm -f ~/.ssh/deploy_key
